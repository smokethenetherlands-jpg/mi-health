name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate .xcodeproj
        run: xcodegen generate --spec project.yml

      - name: Archive
        run: |
          xcodebuild archive \
            -project HealthBridge.xcodeproj \
            -scheme HealthBridge \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/HealthBridge.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          APP=$(find build/HealthBridge.xcarchive/Products -name "*.app" | head -1)
          rm -rf /tmp/Payload && mkdir -p /tmp/Payload/Payload
          cp -r "$APP" /tmp/Payload/Payload/
          cd /tmp/Payload && zip -r "$GITHUB_WORKSPACE/build/HealthBridge_unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HealthBridge_unsigned
          path: build/HealthBridge_unsigned.ipa
